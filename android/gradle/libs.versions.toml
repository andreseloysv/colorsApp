[versions]
agp = "8.9.3"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
room = "2.7.2"
kotlinxSerialization = "1.8.0"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
lifecycle = "2.9.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

# Carril W2 (sujeto): MediaPipe Tasks Vision; YuNet corría con ONNX
# Runtime Mobile hasta el carril W6, que lo convirtió a TFLite float32
# (android/tools/convert_yunet.py): libonnxruntime.so costaba 17,6 MB por
# ABI para un modelo de 232 KB; el intérprete TFLite cuesta ~2,5 MB.
# Versiones fijadas (nunca "latest"): tasks-vision 0.10.35, el otro AAR que
# el carril B inspeccionó (docs/research/android-subject.md §2.1/§8.3, sin
# INTERNET en sus manifiestos). La 1.1.1 se descartó tras medirla en el AVD
# (carril W2): reutilizar una tarea muere con "Packet timestamp mismatch"
# en norm_rect_in, la máscara float de pose falla al empaquetarse en
# algunos tamaños y el InteractiveSegmenterLegacy ignora la ROI (máscara
# idéntica para cualquier punto). tensorflow-lite 2.17.0 (W6).
mediapipeTasksVision = "0.10.35"
tensorflowLite = "2.17.0"

[libraries]
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipeTasksVision" }
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.9.0" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.9.0" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
