[project]
name = "colorsapp-oracle"
version = "0.1.0"
description = "Oráculo de referencia y harness de evaluación del motor de color de colorsApp"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.15",
    "scikit-image>=0.26",
    "colour-science>=0.4.7",
    "pillow>=11",
    "scikit-learn>=1.6",
    "opensimplex>=0.4.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle", "synth", "l4"]
