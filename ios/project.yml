# Proyecto Xcode generado con XcodeGen (`make ios-generate`). El .xcodeproj no
# se versiona. Firma: DEVELOPMENT_TEAM viene de ios/Signing.xcconfig (gitignored;
# copia de ios/Signing.example.xcconfig que `make ios-generate` crea si falta).
#
# Dependencias SPM: el motor local ../engine (producto ColorEngine) y GRDB.swift
# (SQLite, MIT). La red solo se usa para resolver paquetes al compilar; la app
# no usa red (make ios-lint). Sin entitlements ni capabilities (Personal Team).
#
# Recursos del diccionario: se referencian desde ../data/wada (no se copian al
# árbol de ios/); names.es.json es ruta protegida y solo se lee.
name: ColorsApp
options:
  bundleIdPrefix: com.andreseloy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  disabledValidations: [missingConfigFiles]

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ColorEngine:
    path: ../engine
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  ColorsApp:
    type: application
    platform: iOS
    sources:
      - path: ColorsApp
        excludes: [Info.plist]
      # Diccionario de Wada (data/wada), referenciado, no copiado.
      - path: ../data/wada/dictionary.json
        buildPhase: resources
        group: Resources
      - path: ../data/wada/names.es.json
        buildPhase: resources
        group: Resources
    dependencies:
      - package: ColorEngine
        product: ColorEngine
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreseloy.colorsapp
        PRODUCT_NAME: ColorsApp
        INFOPLIST_FILE: ColorsApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  ColorsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColorsAppTests
        excludes: [Fixtures]
      # Fixtures (5 PPM de harness/golden + PNG sRGB/Display P3 + expected_match.json)
      # generadas por oracle/tools/make_ios_fixtures.py; van planas en el bundle del test.
      - path: ColorsAppTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ColorsApp
      - package: ColorEngine
        product: ColorEngine
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreseloy.colorsapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ColorsApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ColorsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ColorsApp:
    build:
      targets:
        ColorsApp: all
        ColorsAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ColorsAppTests]
    archive:
      config: Release
