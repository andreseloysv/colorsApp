# Proyecto Xcode generado con XcodeGen (`make ios-generate`). El .xcodeproj no
# se versiona. Firma: DEVELOPMENT_TEAM viene de ios/Signing.xcconfig (gitignored;
# copia de ios/Signing.example.xcconfig que `make ios-generate` crea si falta).
#
# Dependencias SPM: el motor local ../engine (producto ColorEngine), SubjectKit
# (../apple/SubjectKit: Apple Vision on-device para personas, pose y caras; la
# geometría de ropa y la piel las calcula el motor) y GRDB.swift (SQLite, MIT).
# La red solo se usa para resolver paquetes al compilar; la app no usa red
# (make ios-lint). Sin entitlements ni capabilities (Personal Team).
#
# Recursos del diccionario: se referencian desde ../data/wada (no se copian al
# árbol de ios/); names.es.json es ruta protegida y solo se lee.
#
# Fotos de personas (harness/people, CC0, ver SOURCES.md): se referencian, no se
# copian. En la app solo en Debug (atajos -uiScreen result-people / layers-people);
# en Release las excluye EXCLUDED_SOURCE_FILE_NAMES. En el bundle de tests, dos
# fotos para ScanAnalyzerSubjectTests.
name: ColorsApp
options:
  bundleIdPrefix: com.andreseloy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  disabledValidations: [missingConfigFiles]

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ColorEngine:
    path: ../engine
  SubjectKit:
    path: ../apple/SubjectKit
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  ColorsApp:
    type: application
    platform: iOS
    sources:
      - path: ColorsApp
        excludes: [Info.plist]
      # Diccionario de Wada (data/wada), referenciado, no copiado.
      - path: ../data/wada/dictionary.json
        buildPhase: resources
        group: Resources
      - path: ../data/wada/names.es.json
        buildPhase: resources
        group: Resources
      # Nombres propuestos por el agente (data/wada/names.suggested.json, solo lectura): la
      # Rejilla los muestra marcados «Nombre propuesto» mientras names.es.json siga `pending`.
      - path: ../data/wada/names.suggested.json
        buildPhase: resources
        group: Resources
      # Foto de grupo solo para los atajos de depuración (Release la excluye).
      - path: ../harness/people/06_group_courier_street.png
        buildPhase: resources
        group: DebugResources
    dependencies:
      - package: ColorEngine
        product: ColorEngine
      - package: SubjectKit
        product: SubjectKit
      - package: GRDB
        product: GRDB
    settings:
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "06_group_courier_street.png"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreseloy.colorsapp
        PRODUCT_NAME: ColorsApp
        INFOPLIST_FILE: ColorsApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Icono de la app (Assets.xcassets/AppIcon.appiconset, 1024 px claro/oscuro/tintado)
        # renderizado desde el emblema vectorial con ios/Scripts/render_app_icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ColorsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColorsAppTests
        excludes: [Fixtures]
      # Fixtures (5 PPM de harness/golden + PNG sRGB/Display P3 + expected_match.json)
      # generadas por oracle/tools/make_ios_fixtures.py; van planas en el bundle del test.
      - path: ColorsAppTests/Fixtures
        buildPhase: resources
      # Dos fotos reales de harness/people (pareja de espaldas; vestido con piel).
      - path: ../harness/people/03_couple_denim_street.png
        buildPhase: resources
        group: PeopleFixtures
      - path: ../harness/people/02_single_dress_umbrella.png
        buildPhase: resources
        group: PeopleFixtures
    dependencies:
      - target: ColorsApp
      - package: ColorEngine
        product: ColorEngine
      - package: SubjectKit
        product: SubjectKit
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreseloy.colorsapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ColorsApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ColorsApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ColorsApp:
    build:
      targets:
        ColorsApp: all
        ColorsAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ColorsAppTests]
    archive:
      config: Release
